<VirtualHost *:10000>
    DocumentRoot /var/www/html/public
    PassEnv APP_ENV APP_URL APP_KEY DATABASE_URL DB_SSLMODE CLOUDINARY_URL SUPERADMIN_EMAIL SUPERADMIN_PASSWORD PAYMENT_MODE CINETPAY_APIKEY CINETPAY_SITE_ID OTP_DEMO SMS_API_URL SMS_API_TOKEN SMS_SENDER
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>
    # Seul le dossier public est exposé ; app/, admin/, pages/, storage/ restent inaccessibles.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
